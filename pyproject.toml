readme = "README.md"
authors = [
    { name = "Sparsh", email = "sarodesparsh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.45.0",
    "fastapi>=0.165.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
